<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090D" />
    <meta name="description" content="AtletiQ — Understand your body. Understand your training. Reach your goal." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AtletiQ" />

    <title>AtletiQ — Performance Intelligence</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/mobile.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%2310B981' rx='40' width='192' height='192'/><text x='50%25' y='55%25' font-size='110' fill='%2307090D' text-anchor='middle' dy='.35em' font-family='Inter,system-ui' font-weight='700'>A</text></svg>" />
  </head>

  <body>
    <!-- App Container -->
    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="app-header__content">
          <div class="app-header__left">
            <div class="app-header__greeting" id="header-greeting">Good morning</div>
            <div class="app-header__date" id="header-date"></div>
          </div>
          <div class="app-header__actions">
            <div class="app-header__avatar" id="profile-btn" role="button" aria-label="Profile">A</div>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="app-content">
        <div class="app-content__inner" id="main-content">
          <!-- Dashboard content injected by JS -->
        </div>
      </main>

      <!-- Floating Action Button -->
      <button class="fab" id="fab-btn" aria-label="Quick log">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav" role="tablist" id="bottom-nav">
        <div class="bottom-nav__item active" data-route="dashboard" role="tab" aria-selected="true" id="nav-today">
          <div class="bottom-nav__icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="bottom-nav__label">Today</div>
        </div>
        <div class="bottom-nav__item" data-route="timeline" role="tab" aria-selected="false" id="nav-timeline">
          <div class="bottom-nav__icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="20" x2="12" y2="4"/>
              <polyline points="6 10 12 4 18 10"/>
              <line x1="4" y1="20" x2="20" y2="20"/>
            </svg>
          </div>
          <div class="bottom-nav__label">Timeline</div>
        </div>
        <div class="bottom-nav__item" data-route="prepare" role="tab" aria-selected="false" id="nav-prepare">
          <div class="bottom-nav__icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </div>
          <div class="bottom-nav__label">Prepare</div>
        </div>
        <div class="bottom-nav__item" data-route="stats" role="tab" aria-selected="false" id="nav-stats">
          <div class="bottom-nav__icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 20V10M12 20V4M6 20v-6"/>
            </svg>
          </div>
          <div class="bottom-nav__label">Stats</div>
        </div>
        <div class="bottom-nav__item" data-route="profile" role="tab" aria-selected="false" id="nav-profile">
          <div class="bottom-nav__icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="bottom-nav__label">Profile</div>
        </div>
      </nav>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
